<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TitleGenie</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    }
  </style>
</head>
<body>
  <div class="login-page-container">
    <div class="login-header">
      <h2>🔐 Login to TitleGenie</h2>
      <button class="close-btn" onclick="goBack()">&times;</button>
    </div>
    
    <form id="loginForm" style="padding: 30px; display: flex; flex-direction: column; gap: 20px;">
      <div class="input-group">
        <span class="input-icon">📧</span>
        <input type="email" id="loginEmail" placeholder="Email Address" required />
      </div>
      
      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="loginPassword" placeholder="Password" required />
        <span class="password-toggle" id="togglePassword">👁️</span>
      </div>
      
      <div class="login-options" style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe">
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>
      
      <button type="submit" class="generate-btn login-submit" style="width: 100%; justify-content: center; margin: 10px 0;">
        <span class="btn-icon">🚀</span>
        Login
      </button>
      
      <div class="login-divider" style="text-align: center; position: relative; margin: 20px 0;">
        <span style="background: white; padding: 0 20px; color: #666; font-size: 14px;">or</span>
      </div>
      
      <div class="alternative-login" style="text-align: center; padding: 15px 0;">
        <p style="color: #666; margin: 0;">New to TitleGenie? <a href="#" id="signupLink">Create an account</a></p>
      </div>
    </form>
    
    <div class="signup-link" style="text-align: center; padding: 20px 30px; border-top: 1px solid #e1e5e9; background: #f8f9fa;">
      <p style="color: #666; margin: 0;">Don't have an account? <a href="#" id="signupLink2">Sign up here</a></p>
    </div>
    
    <div class="back-to-home">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <script>
    // Login functionality
    const loginForm = document.getElementById("loginForm");
    const togglePassword = document.getElementById("togglePassword");
    
    // Password visibility toggle
    togglePassword.onclick = function() {
      const passwordInput = document.getElementById('loginPassword');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    };
    
    // Handle login form submission
    loginForm.onsubmit = function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      if (!email || !password) {
        showNotification('⚠️ Please fill in all fields', 'error');
        return;
      }
      
      // Add loading state
      const submitBtn = e.target.querySelector('.login-submit');
      const originalText = submitBtn.innerHTML;
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="btn-icon">⏳</span> Logging in...';
      
      // Simulate login process
      setTimeout(() => {
        // Reset button
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
        
        // Mock login validation
        // if (email === 'demo@titlegenie.com' && password === 'demo123') {
        //   showNotification('🎉 Login successful! Redirecting...', 'success');
          
        //   // Store login info
        //   if (typeof(Storage) !== "undefined") {
        //     sessionStorage.setItem('isLoggedIn', 'true');
        //     sessionStorage.setItem('userEmail', email);
        //     if (rememberMe) {
        //       localStorage.setItem('rememberUser', email);
        //     }
        //   }
          
        //   // Redirect to home page after success
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        // } else {
        //   showNotification('❌ Invalid credentials. Try demo@titlegenie.com / demo123', 'error');
        // }
      }, 2000);
    };
    
    // Go back function
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
    
    // Sign up link handlers
    document.getElementById('signupLink').onclick = function(e) {
      e.preventDefault();
      showNotification('🚀 Sign up functionality would be implemented here', 'info');
    };
    
    document.getElementById('signupLink2').onclick = function(e) {
      e.preventDefault();
      showNotification('🚀 Sign up functionality would be implemented here', 'info');
    };
    
    // Forgot password handler
    document.querySelector('.forgot-password').onclick = function(e) {
      e.preventDefault();
      showNotification('📧 Password reset email would be sent', 'info');
    };
    
    // Auto-fill remembered user
    window.addEventListener('load', () => {
      if (typeof(Storage) !== "undefined") {
        const rememberedUser = localStorage.getItem('rememberUser');
        if (rememberedUser) {
          document.getElementById('loginEmail').value = rememberedUser;
          document.getElementById('rememberMe').checked = true;
        }
      }
    });
    
    // Notification system
    function showNotification(message, type = 'info') {
      // Remove existing notifications
      const existingNotifications = document.querySelectorAll('.notification');
      existingNotifications.forEach(notif => notif.remove());
      
      const notification = document.createElement('div');
      notification.className = `notification notification-${type}`;
      notification.innerHTML = `
        <div class="notification-content">
          <span class="notification-message">${message}</span>
          <button class="notification-close">×</button>
        </div>
      `;
      
      // Notification styles
      const style = document.createElement('style');
      style.textContent = `
        .notification {
          position: fixed;
          top: 20px;
          right: 20px;
          background: white;
          border-radius: 10px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
          z-index: 10000;
          min-width: 300px;
          max-width: 400px;
          animation: slideInRight 0.3s ease-out;
        }
        
        .notification-success { border-left: 4px solid #28a745; }
        .notification-error { border-left: 4px solid #dc3545; }
        .notification-info { border-left: 4px solid #17a2b8; }
        
        .notification-content {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 15px 20px;
        }
        
        .notification-message {
          color: #333;
          font-size: 14px;
          font-weight: 500;
        }
        
        .notification-close {
          background: none;
          border: none;
          font-size: 18px;
          cursor: pointer;
          color: #666;
          padding: 0;
          margin-left: 15px;
        }
        
        @keyframes slideInRight {
          from { transform: translateX(100%); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
      `;
      
      if (!document.querySelector('#notification-styles')) {
        style.id = 'notification-styles';
        document.head.appendChild(style);
      }
      
      document.body.appendChild(notification);
      
      // Auto remove after 4 seconds
      const autoRemoveTimeout = setTimeout(() => {
        removeNotification(notification);
      }, 4000);
      
      // Manual close
      const closeBtn = notification.querySelector('.notification-close');
      closeBtn.onclick = () => {
        clearTimeout(autoRemoveTimeout);
        removeNotification(notification);
      };
    }
    
    // Remove notification with animation
    function removeNotification(notification) {
      notification.style.animation = 'slideOutRight 0.3s ease-out';
      setTimeout(() => {
        if (notification.parentNode) {
          notification.parentNode.removeChild(notification);
        }
      }, 300);
    }
  </script>
</body>
</html>
