<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TitleGenie</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #2b3233;
    }
  </style>
</head>
<body>
  <div class="login-page-container">
    <div class="login-header">
      <h2><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M13 21q-.425 0-.712-.288T12 20t.288-.712T13 19h6V5h-6q-.425 0-.712-.288T12 4t.288-.712T13 3h6q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zm-1.825-8H4q-.425 0-.712-.288T3 12t.288-.712T4 11h7.175L9.3 9.125q-.275-.275-.275-.675t.275-.7t.7-.313t.725.288L14.3 11.3q.3.3.3.7t-.3.7l-3.575 3.575q-.3.3-.712.288T9.3 16.25q-.275-.3-.262-.712t.287-.688z"/></svg> Login to TitleGenie</h2>
      <button class="close-btn" onclick="goBack()">&times;</button>
    </div>
    
    <form id="loginForm" style="padding: 30px; display: flex; flex-direction: column; gap: 20px;">
      <div class="input-group">
        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" fill-rule="evenodd" d="m7.172 11.334l2.83 1.935l2.728-1.882l6.115 6.033q-.242.079-.512.08H1.667c-.22 0-.43-.043-.623-.12zM20 6.376v9.457c0 .247-.054.481-.15.692l-5.994-5.914zM0 6.429l6.042 4.132l-5.936 5.858A1.7 1.7 0 0 1 0 15.833zM18.333 2.5c.92 0 1.667.746 1.667 1.667v.586L9.998 11.648L0 4.81v-.643C0 3.247.746 2.5 1.667 2.5z"/></svg></span>
        <input type="email" id="loginEmail" placeholder="Email Address" required />
      </div>
      
      <div class="input-group">
        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M6.616 21q-.667 0-1.141-.475T5 19.386v-8.77q0-.666.475-1.14T6.615 9H8V7q0-1.671 1.165-2.835Q10.329 3 12 3t2.836 1.165T16 7v2h1.385q.666 0 1.14.475t.475 1.14v8.77q0 .666-.475 1.14t-1.14.475zM12 16.5q.633 0 1.066-.434q.434-.433.434-1.066t-.434-1.066T12 13.5t-1.066.434Q10.5 14.367 10.5 15t.434 1.066q.433.434 1.066.434M9 9h6V7q0-1.25-.875-2.125T12 4t-2.125.875T9 7z"/></svg></span>
        <input type="password" id="loginPassword" placeholder="Password" required />
        <span class="password-toggle" id="togglePassword"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 12 12"><path fill="currentColor" d="M1.974 6.659a.5.5 0 0 1-.948-.317c-.01.03 0-.001 0-.001a2 2 0 0 1 .062-.162c.04-.095.099-.226.18-.381c.165-.31.422-.723.801-1.136C2.834 3.827 4.087 3 6 3s3.166.827 3.931 1.662a5.5 5.5 0 0 1 .98 1.517l.046.113c.003.008.013.06.023.11L11 6.5s.084.333-.342.474a.5.5 0 0 1-.632-.314v-.003l-.006-.016l-.031-.078a4.5 4.5 0 0 0-.795-1.226C8.584 4.674 7.587 4 6 4s-2.584.673-3.194 1.338a4.5 4.5 0 0 0-.795 1.225l-.03.078zM4 7a2 2 0 1 1 4 0a2 2 0 0 1-4 0"/></svg></span>
      </div>
      
      <div class="login-options" style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe">
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>
      
      <button type="submit" class="generate-btn login-submit" style="width: 100%; justify-content: center; margin: 10px 0;">
        <span class="btn-icon">🚀</span>
        Login
      </button>
      
      <div class="login-divider" style="text-align: center; position: relative; margin: 20px 0;">
        <span style="background: white; padding: 0 20px; color: #666; font-size: 14px;">or</span>
      </div>
      
      <div class="alternative-login" style="text-align: center; padding: 15px 0;">
        <p style="color: #666; margin: 0;">New to TitleGenie? <a href="#" id="signupLink">Create an account</a></p>
      </div>
    </form>
    
    <div class="signup-link" style="text-align: center; padding: 20px 30px; border-top: 1px solid #e1e5e9; background: #f8f9fa;">
      <p style="color: #666; margin: 0;">Don't have an account? <a href="#" id="signupLink2">Sign up here</a></p>
    </div>
    
    <div class="back-to-home">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <script>
    // Login functionality
    const loginForm = document.getElementById("loginForm");
    const togglePassword = document.getElementById("togglePassword");
    const eyeImage = document.getElementsByClassName("toggle-password");

    // Password visibility toggle
    togglePassword.onclick = function() {
      const passwordInput = document.getElementById('loginPassword');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.textContent = type === 'password' ? '👀' : '🙈';
    };
    
    // Handle login form submission
    loginForm.onsubmit = function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      if (!email || !password) {
        showNotification('⚠️ Please fill in all fields', 'error');
        return;
      }
      
      // Add loading state
      const submitBtn = e.target.querySelector('.login-submit');
      const originalText = submitBtn.innerHTML;
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="btn-icon">⏳</span> Logging in...';
      
      // Simulate login process
      setTimeout(() => {
        // Reset button
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
        
        // Mock login validation
        // if (email === 'demo@titlegenie.com' && password === 'demo123') {
        //   showNotification('🎉 Login successful! Redirecting...', 'success');
          
        //   // Store login info
          if (typeof(Storage) !== "undefined") {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userEmail', email);
            if (rememberMe) {
              localStorage.setItem('rememberUser', email);
            }
          }
          function updateLoginState(isLoggedIn, email = '') {
            if (isLoggedIn && loginLink) {
              loginLink.innerHTML = ` HI, ${email.split('@')[0]}!`;
              loginLink.style.background = 'linear-gradient(45deg, #28a745, #20c997)';
              loginLink.href = '#';
              loginLink.onclick = handleLogout;
            } else if (loginLink) {
              loginLink.innerHTML = ` Login`;
              loginLink.style.background = 'linear-gradient(45deg, #ff6f61, #ff8a65)';
              loginLink.href = 'login.html';
              loginLink.onclick = null;
            }
          }
          
        //   // Redirect to home page after success
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        // } else {
        //   showNotification('❌ Invalid credentials. Try demo@titlegenie.com / demo123', 'error');
        // }
      }, 2000);
    };
    
    // Go back function
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
    
    // Sign up link handlers
    document.getElementById('signupLink').onclick = function(e) {
      e.preventDefault();
      showNotification(' Sign up functionality would be implemented here', 'info');
    };
    
    document.getElementById('signupLink2').onclick = function(e) {
      e.preventDefault();
      showNotification(' Sign up functionality would be implemented here', 'info');
    };
    
    // Forgot password handler
    document.querySelector('.forgot-password').onclick = function(e) {
      e.preventDefault();
      showNotification(' Password reset email would be sent', 'info');
    };
    
    // Auto-fill remembered user
    window.addEventListener('load', () => {
      if (typeof(Storage) !== "undefined") {
        const rememberedUser = localStorage.getItem('rememberUser');
        if (rememberedUser) {
          document.getElementById('loginEmail').value = rememberedUser;
          document.getElementById('rememberMe').checked = true;
        }
      }
    });
    
    // Notification system
    function showNotification(message, type = 'info') {
      // Remove existing notifications
      const existingNotifications = document.querySelectorAll('.notification');
      existingNotifications.forEach(notif => notif.remove());
      
      const notification = document.createElement('div');
      notification.className = `notification notification-${type}`;
      notification.innerHTML = `
        <div class="notification-content">
          <span class="notification-message">${message}</span>
          <button class="notification-close">×</button>
        </div>
      `;
      
      // Notification styles
      const style = document.createElement('style');
      style.textContent = `
        .notification {
          position: fixed;
          top: 20px;
          right: 20px;
          background: white;
          border-radius: 10px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
          z-index: 10000;
          min-width: 300px;
          max-width: 400px;
          animation: slideInRight 0.3s ease-out;
        }
        
        .notification-success { border-left: 4px solid #28a745; }
        .notification-error { border-left: 4px solid #dc3545; }
        .notification-info { border-left: 4px solid #17a2b8; }
        
        .notification-content {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 15px 20px;
        }
        
        .notification-message {
          color: #333;
          font-size: 14px;
          font-weight: 500;
        }
        
        .notification-close {
          background: none;
          border: none;
          font-size: 18px;
          cursor: pointer;
          color: #666;
          padding: 0;
          margin-left: 15px;
        }
        
        @keyframes slideInRight {
          from { transform: translateX(100%); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
      `;
      
      if (!document.querySelector('#notification-styles')) {
        style.id = 'notification-styles';
        document.head.appendChild(style);
      }
      
      document.body.appendChild(notification);
      
      // Auto remove after 4 seconds
      const autoRemoveTimeout = setTimeout(() => {
        removeNotification(notification);
      }, 4000);
      
      // Manual close
      const closeBtn = notification.querySelector('.notification-close');
      closeBtn.onclick = () => {
        clearTimeout(autoRemoveTimeout);
        removeNotification(notification);
      };
    }
    
    // Remove notification with animation
    function removeNotification(notification) {
      notification.style.animation = 'slideOutRight 0.3s ease-out';
      setTimeout(() => {
        if (notification.parentNode) {
          notification.parentNode.removeChild(notification);
        }
      }, 300);
    }
  </script>
</body>
</html>
